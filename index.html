<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Sizzling Punjab - Digital Food Menu">

    <title>Sizzling Punjab | Digital Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="hero">

        <div class="hero-content">

            <div class="logo-circle">
                🍽️
            </div>

            <h1>Sizzling Punjab</h1>

            <p>Delicious Food • Great Taste</p>

        </div>

    </header>


    <!-- ================= SEARCH ================= -->

    <div class="sticky-area">

        <div class="search-box">

            <span>🔍</span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a dish..."
            >

        </div>


        <!-- CATEGORY BUTTONS -->

        <div class="categories" id="categories">

            <button class="category-btn active"
                    data-category="all">
                All
            </button>

            <button class="category-btn"
                    data-category="momo">
                Momos
            </button>

            <button class="category-btn"
                    data-category="noodles">
                Noodles
            </button>

            <button class="category-btn"
                    data-category="starters">
                Starters
            </button>

            <button class="category-btn"
                    data-category="rice">
                Rice
            </button>

            <button class="category-btn"
                    data-category="punjabi">
                Punjabi
            </button>

            <button class="category-btn"
                    data-category="indian">
                Indian
            </button>

            <button class="category-btn"
                    data-category="chaat">
                Chaats
            </button>

            <button class="category-btn"
                    data-category="paratha">
                Paratha
            </button>

            <button class="category-btn"
                    data-category="beverages">
                Beverages
            </button>

            <button class="category-btn"
                    data-category="dessert">
                Dessert
            </button>

        </div>

    </div>


    <!-- ================= MENU ================= -->

    <main id="menuContainer">

        <!-- JavaScript will generate the menu here -->

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h2>Sizzling Punjab</h2>

        <p>📞 8949455176</p>

        <p>📞 8949397052</p>

        <p>📞 8279111032</p>

        <br>

        <p>
            🚚 Delivery available
        </p>

        <p>
            * Delivery free above ₹200
        </p>

        <p>
            * Packaging charges extra
        </p>

        <p>
            * Customized combos also available
        </p>

        <br>

        <p class="copyright">
            Thank you for visiting ❤️
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
